name: Build TV APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build TV APK
        run: |
          set -o pipefail
          gradle assembleTvDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Execution failed" -A2 build.log | head -30 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/tv/debug/*.apk dist/MetroMap-tv-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MetroMap-tv-apk
          path: dist/*.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
