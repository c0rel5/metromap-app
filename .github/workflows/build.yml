name: Build APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build phone + TV
        run: gradle assemblePhoneDebug assembleTvDebug
      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/phone/debug/*.apk dist/MetroMap-phone-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/tv/debug/*.apk    dist/MetroMap-tv-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MetroMap-phone-apk
          path: dist/MetroMap-phone-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MetroMap-tv-apk
          path: dist/MetroMap-tv-*.apk
      # По тегу vX.Y — автоматический релиз с обоими APK
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
